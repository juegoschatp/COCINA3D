 fdG.rotation.y+=((fo?1.5:0)-fdG.rotation.y)*(1-Math.exp(-dt*8));for(const k in AV){const a=AV[k],t=a.userData.t;if(t){a.position.x+=(t[0]-a.position.x)*.2;a.position.z+=(t[1]-a.position.z)*.2;a.rotation.y+=(((t[2]-a.rotation.y+Math.PI)%6.2832+6.2832)%6.2832-Math.PI)*.2}const bd=a.userData.body;if(bd){const mv=t?Math.min(1,Math.hypot(t[0]-a.position.x,t[1]-a.position.z)*8):0,w=Math.sin(now/150)*.012*mv;bd.scale.set(1+w,1-w,1+w);bd.position.y=Math.abs(Math.sin(now/150))*.02*mv}animAv(a,k,dt)}
